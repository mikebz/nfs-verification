# A PersistentVolumeClaim created by the harness. Defaults are RWX at the
# configured size on the discovered RWX StorageClass.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Name | q }}
  namespace: {{ .Namespace | q }}
  labels:
    {{- range $key, $value := .Labels }}
    {{ $key | q }}: {{ $value | q }}
    {{- end }}
spec:
  accessModes:
    - {{ .AccessMode | q }}
  # Empty, not absent: an empty class means no storage class and lets a claim
  # bind by volumeName alone without Kubernetes defaulting it to the cluster's
  # default StorageClass.
  storageClassName: {{ .StorageClass | q }}
  resources:
    requests:
      storage: {{ .Size | q }}
  {{- if .DataSource }}
  dataSource:
    {{- if .DataSource.APIGroup }}
    apiGroup: {{ .DataSource.APIGroup | q }}
    {{- end }}
    kind: {{ .DataSource.Kind | q }}
    name: {{ .DataSource.Name | q }}
  {{- end }}
